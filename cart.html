<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart Icon</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .cart {
            position: relative;
            display: inline-block;
            padding: 15px;
            color: #282c3f;
            text-align: center;
            text-decoration: none;
        }

        .cart-icon {
            font-size: 30px;
        }

        .cart-count {
            position: absolute;
            top: 5px;
            right: 2px;
            background: #ff3f6c;
            color: white;
            border-radius: 50%;
            font-size: 11px;
            min-width: 17px;
            height: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <a href="cart.html" class="cart">
        <span class="cart-icon">🛍️</span>
        <span class="cart-count">2</span>
        <span class="cart-label">Bag</span>
    </a>

</body>
</html>
